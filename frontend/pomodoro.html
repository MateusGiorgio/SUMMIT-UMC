<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Flow</title>
    <link rel="stylesheet" href="pomodoro.css">
</head>

<body>

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <h2>Pomodoro Flow</h2>

        <ul>
            <li class="ativo">🕐 Timer</li>
            <li>✅ Tarefas</li>
            <li>📝 Notas</li>
            <li>📊 Histórico</li>
            <li>⚙️Configurações</li>
            <li><a href="landing.html">Sobre o projeto</a></li>
        </ul>

        <div class="perfil">

            <div class="avatar">
                👤
            </div>

            <div class="dados-usuario">
                <strong class="nome-usuario">Visitante</strong>
                <span>Foco em progresso</span>
            </div>

        </div>

        <button class="btn-sair">
            🚪 Sair da conta
        </button>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="conteudo">

        <h1>Em que vamos focar agora?</h1>

        <!-- TIMER -->
        <div class="timer-box">

            <div class="abas">

                <button class="aba ativa">
                    🔥 Foco
                </button>

                <button class="aba">
                    ☕ Pausa curta
                </button>

                <button class="aba">
                    💤 Pausa longa
                </button>

            </div>

            <!-- CÍRCULO DO TIMER -->
            <div class="timer-circulo">

                <div class="timer-conteudo">

                    <span class="status-timer">
                        TEMPO DE FOCO
                    </span>

                    <h2>25:00</h2>

                </div>

            </div>
            <!-- BOTÕES -->
            <div class="botoes-timer">
                <button class="btn-iniciar">▶ Iniciar foco</button>
                <button class="btn-reiniciar">↻ Reiniciar</button>
            </div>

        </div>

        <!-- ESTATÍSTICAS -->
        <div class="estatisticas">

            <div class="card">

                <div class="icone-card">
                    🎯
                </div>

                <div>
                    <h3>Foco hoje</h3>
                    <p class="tempo-focado">0min</p>
                </div>

            </div>


            <div class="card">

                <div class="icone-card">
                    ⏱️
                </div>

                <div>
                    <h3>Sessões</h3>
                    <p class="total-sessoes">0 sessões</p>
                </div>

            </div>


            <div class="card">

                <div class="icone-card">
                    🏆
                </div>

                <div class="meta">
                    <h3>Meta diária</h3>
                    <label for="meta-minutos">Sua meta em minutos</label>
                    <input id="meta-minutos" type="number" min="1" max="1440" value="120">
                    <p><span class="tempo-meta">0h 0min</span> <span class="valor-meta">/ 2h</span></p>

                    <div class="barra">
                        <div class="progresso"></div>
                    </div>

                    <small class="percentual-meta">0% concluído</small>
                </div>

            </div>

        </div>

    </main>


    <!-- TAREFAS -->
    <aside class="tarefas recolhida">
        <button class="alternar-tarefas" type="button" aria-label="Abrir tarefas" aria-expanded="false">📋</button>
        <button class="nova-tarefa">+ Nova tarefa</button>
        <p class="resumo-tarefas">0 de 0 concluídas</p>
        <form class="form-tarefa" hidden>
            <input type="text" placeholder="Digite uma tarefa" aria-label="Nova tarefa" required>
            <button type="submit">Adicionar</button>
        </form>

        <div class="lista-tarefas"></div>
    </aside>

    <script src="pomodoro.js"></script>
</body>

</html>
