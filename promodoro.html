<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Flow</title>
    <link rel="stylesheet" href="promodoro.css">
</head>
<body>

    <aside class="sidebar">
        <h2> Pomodoro Flow</h2>

     
        <ul>
            <li class="ativo"> Timer</li>
            <li> Tarefas</li>
            <li> Notas</li>
            <li> Histórico</li>
        </ul>
    </aside>

    <main class="conteudo">
        <h1>Em que vamos focar agora?</h1>

        <div class="timer-box">
            <div class="abas">
                <button>Foco</button>
                <button>Pausa </button>
                <button>Pausa</button>
            </div>

            <h2>00:00</h2>

            <button class="btn-iniciar">
                ▶ Iniciar foco
            </button>
        </div>

        <div class="estatisticas">
            <div class="card">
                <h3>Foco hoje</h3>
                <p>1h 40min</p>
            </div>

            <div class="card">
                <h3>Sessões</h3>
                <p>4</p>
            </div>

            <div class="card">
                <h3>Meta diária</h3>
                <p>2h</p>
            </div>
        </div>
    </main>

    <aside class="tarefas">
        <h2>Atividades de hoje</h2>

        <div class="tarefa">
            <input type="checkbox">
            Revisar JavaScript
        </div>

        <div class="tarefa">
            <input type="checkbox">
            Exercícios de lógica
        </div>

        <div class="tarefa">
            <input type="checkbox">
            Ler capítulo 3
        </div>

        <div class = "logo">
<img src="c:\Users\mateu\Downloads\WhatsApp Image 2026-09-09 at 23.19.48.jpeg" alt="Logo Pomodoro Flow">  
    </div>

    </aside>

</body>
</html>
